version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "9000:5678"  # This opens the n8n UI
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password123 # Change this later
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

volumes:
  n8n_data: